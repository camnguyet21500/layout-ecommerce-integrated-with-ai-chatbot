<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Mega Mall</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="../../css/login.css"> <!-- Giữ nguyên file CSS của login -->
</head>
<body>
<div class="login-card">
    <div class="login-header">
        <img src="../../img/mega_mall_logo.png" alt="Mega Mall Logo">
        <h3>MEGA MALL</h3>
        <p>Reset your password</p>
    </div>

    <div class="login-body">
        <form id="forgotPasswordForm">
            <div class="form-group">
                <input type="email" class="form-control" id="resetEmail" placeholder="Email address" required>
            </div>

            <div id="resetError" class="text-danger text-center mb-3" style="display:none;"></div>

            <button type="submit" class="btn btn-login text-white">SUBMIT</button>
        </form>

        <div class="text-center mt-3">
            <p>Remember your password? <a href="login.html" class="text-link">Back to Login</a></p>
        </div>
    </div>
</div>

<!-- Toast thông báo (giống login) -->
<div aria-live="polite" aria-atomic="true" style="position: fixed; top: 20px; right: 20px; z-index: 1050;">
    <div id="resetToast" class="toast" data-delay="3000">
        <div class="toast-header">
            <strong class="mr-auto" id="toastTitle"></strong>
            <button type="button" class="ml-2 mb-1 close" data-dismiss="toast">&times;</button>
        </div>
        <div class="toast-body" id="toastMessage"></div>
    </div>
</div>

<script>
    const BASE_URL = "http://localhost:8888/api";

    function showToast(title, message, success = true) {
        $('#toastTitle').text(title);
        $('#toastMessage').text(message);
        $('#resetToast')
            .removeClass('bg-success bg-danger text-white')
            .addClass(success ? 'bg-success text-white' : 'bg-danger text-white')
            .toast('show');
    }

    $('#forgotPasswordForm').on('submit', async function(e) {
        e.preventDefault();
        $('#resetError').hide().text('');

        const email = $('#resetEmail').val().trim();

        if (!email) {
            $('#resetError').text('Please enter your email address.').show();
            return;
        }

        try {
            const res = await fetch(`${BASE_URL}/auth/forgot-password`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            });

            const data = await res.json();

            if (!res.ok) {
                const msg = data.message || 'Email not found or server error.';
                $('#resetError').text(msg).show();
                showToast("Error", msg, false);
                return;
            }

            // Thành công
            showToast("Success", "Password reset link has been sent to your email!");

            // Sau 2 giây chuyển về trang login
            setTimeout(() => {
                window.location.href = 'login.html';
            }, 2000);

        } catch (err) {
            console.error("Connection error:", err);
            $('#resetError').text('Server connection error. Please try again later.').show();
            showToast("Error", "Connection failed. Please check your network.", false);
        }
    });
</script>
</body>
</html>
