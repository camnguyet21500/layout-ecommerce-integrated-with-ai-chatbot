        <p>Reset your password</p>
    </div>

    <div class="login-body">
        <form id="forgotPasswordForm">
            <div class="form-group">
                <input type="email" class="form-control" id="resetEmail" placeholder="Email address" required>
            </div>
            <!-- Thêm input phone -->
            <div class="form-group">
                <input type="tel" class="form-control" id="resetPhone" placeholder="Số điện thoại" required>
            </div>
            <div id="resetError" class="text-danger text-center mb-3" style="display:none;"></div>
            <button type="submit" class="btn btn-login text-white">SUBMIT</button>
        </form>
        <div class="text-center mt-3">

</div>

        <div class="toast-body" id="toastMessage"></div>
    </div>
</div>

<script>
    const BASE_URL = "http://localhost:8888/api";

    function showToast(title, message, success = true) {
        $('#toastTitle').text(title);
        $('#toastMessage').text(message);
        $('#resetToast')
            .removeClass('bg-success bg-danger text-white')
            .addClass(success ? 'bg-success text-white' : 'bg-danger text-white')
            .toast('show');
    }

    $('#forgotPasswordForm').on('submit', async function(e) {
        e.preventDefault();
        $('#resetError').hide().text('');

        const email = $('#resetEmail').val().trim();
        const phone = $('#resetPhone').val().trim();

        if (!email) {
            $('#resetError').text('Vui lòng nhập email.').show();
            return;
        }
        if (!phone) {
            $('#resetError').text('Vui lòng nhập số điện thoại.').show();
            return;
        }

        // Lấy chỉ phần trước dấu @ (username)
        const emailUsername = email.split('@')[0];  // ví dụ: camnguyet21500

        // Tạo link redirectTo chỉ dùng username (không có @gmail.com)
        const redirectToLink = `http://localhost:63342/layout-ecommerce-integrated-with-ai-chatbot/lib/customer/reset_password.html?email=${encodeURIComponent(emailUsername)}@gmail.com`;

        // Console log để kiểm tra
        console.log('Email username (trước @):', emailUsername);
        console.log('Link redirectTo sẽ gửi lên backend:', redirectToLink);

        try {
            const res = await fetch(`${BASE_URL}/auth/forgot-password`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    email,
                    phone,
                    redirectTo: redirectToLink  // gửi link đã cắt phần @gmail.com
                })
            });

            const data = await res.json();

            if (!res.ok) {
                const msg = data.message || 'Email not found or server error.';
                $('#resetError').text(msg).show();
                showToast("Error", msg, false);
                return;
            }

            console.log('Response từ backend:', data);
            if (data.redirectTo) {
                console.log('Link redirectTo nhận được từ backend:', data.redirectTo);
            } else if (data.resetUrl) {
                console.log('Link resetUrl nhận được từ backend:', data.resetUrl);
            } else {
                console.log('Backend không trả về link redirectTo/resetUrl nào!');
            }

            showToast("Success", "Password reset link has been sent to your email!");

        } catch (err) {
            console.error("Connection error:", err);
            $('#resetError').text('Server connection error. Please try again later.').show();
            showToast("Error", "Connection failed. Please check your network.", false);
        }
    });
</script>
