<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Mega Mall</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="../../css/login.css"> <!-- Giữ nguyên file CSS của login -->
</head>
<body>
<div class="login-card">
    <div class="login-header">
        <img src="../../img/mega_mall_logo.png" alt="Mega Mall Logo">
        <h3>MEGA MALL</h3>
        <p>Set your new password</p>
    </div>

    <div class="login-body">
        <form id="resetPasswordForm">
            <div class="form-group">
                <input type="password" class="form-control" id="newPassword" placeholder="New Password" required>
            </div>

            <div class="form-group">
                <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm New Password" required>
            </div>

            <div id="resetError" class="text-danger text-center mb-3" style="display:none;"></div>

            <button type="submit" class="btn btn-login text-white">SUBMIT</button>
        </form>

        <div class="text-center mt-3">
            <p>Remember your password? <a href="login.html" class="text-link">Back to Login</a></p>
        </div>
    </div>
</div>

<!-- Toast thông báo (giống login) -->
<div aria-live="polite" aria-atomic="true" style="position: fixed; top: 20px; right: 20px; z-index: 1050;">
    <div id="resetToast" class="toast" data-delay="3000">
        <div class="toast-header">
            <strong class="mr-auto" id="toastTitle"></strong>
            <button type="button" class="ml-2 mb-1 close" data-dismiss="toast">&times;</button>
        </div>
        <div class="toast-body" id="toastMessage"></div>
    </div>
</div>

<script>
    const BASE_URL = "http://localhost:8888/api";

    function showToast(title, message, success = true) {
        $('#toastTitle').text(title);
        $('#toastMessage').text(message);
        $('#resetToast')
            .removeClass('bg-success bg-danger text-white')
            .addClass(success ? 'bg-success text-white' : 'bg-danger text-white')
            .toast('show');
    }

    $('#resetPasswordForm').on('submit', async function(e) {
        e.preventDefault();
        $('#resetError').hide().text('');

        const newPassword = $('#newPassword').val();
        const confirmPassword = $('#confirmPassword').val();

        // Kiểm tra cơ bản
        if (!newPassword || !confirmPassword) {
            $('#resetError').text('Please enter both password fields.').show();
            return;
        }

        if (newPassword !== confirmPassword) {
            $('#resetError').text('Passwords do not match. Please try again.').show();
            return;
        }

        if (newPassword.length < 6) {
            $('#resetError').text('Password must be at least 6 characters long.').show();
            return;
        }

        try {

            const urlParams = new URLSearchParams(window.location.search);
            const resetToken = urlParams.get('token');

            if (!resetToken) {
                $('#resetError').text('Invalid or missing reset token. Please request a new reset link.').show();
                return;
            }

            const res = await fetch(`${BASE_URL}/auth/reset-password`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    token: resetToken,
                    newPassword: newPassword
                })
            });

            const data = await res.json();

            if (!res.ok) {
                const msg = data.message || 'Failed to reset password. Token may be invalid or expired.';
                $('#resetError').text(msg).show();
                showToast("Error", msg, false);
                return;
            }


            showToast("Success", "Your password has been reset successfully! Redirecting to login...");


            setTimeout(() => {
                window.location.href = 'login.html';
            }, 2500);

        } catch (err) {
            console.error("Connection error:", err);
            $('#resetError').text('Server connection error. Please try again later.').show();
            showToast("Error", "Connection failed. Please check your network.", false);
        }
    });
</script>
</body>
</html>
